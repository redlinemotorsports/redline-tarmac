name: Build and deploy Redline Tarmac

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch rally newsroom headlines
        run: node scripts/fetch-rally-news.mjs
      - name: Fetch WRC Live Timing data (primary)
        continue-on-error: true
        env:
          OPEN_RALLY_MAX_EVENTS: "3"
        run: node scripts/fetch-open-rally.mjs
      - name: Fetch Moto-DB schedule and publish normalized rally snapshots
        run: node scripts/fetch-moto-db.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Verify Redline Tarmac

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/fetch-rally-news.mjs
      - run: node --check scripts/fetch-rally-control.mjs
      - run: node --check src/rally-control-data.js
      - run: node --check src/data-centre.js
      - run: node --check src/newsroom-feed.js
      - name: Verify live rally feed ingestion
        run: |
          node scripts/fetch-rally-news.mjs
          node -e 'const s=require("./public/data/rally-news.json"); if (!s.articles.length || !s.sources.some(x => x.status === "ok")) process.exit(1); console.log(`Verified ${s.articles.length} headlines from ${s.sources.filter(x => x.status === "ok").length} online feeds.`);'
      - run: npm run build

name: Validate Redline Tarmac

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check rally data adapters and UI syntax
        run: |
          node --check scripts/fetch-open-rally.mjs
          node --check scripts/fetch-moto-db.mjs
          node --check scripts/fetch-wrc-standings.mjs
          node --check src/data-centre.js
          node --check src/rally-control-data.js
      - name: Build site
        run: npm run build

name: Validate Redline Tarmac

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check rally data adapters and UI syntax
        run: |
          node --check scripts/fetch-fia-standings.mjs
          node --check scripts/fetch-open-rally.mjs
          node --check scripts/fetch-moto-db.mjs
          node --check src/data-centre.js
          node --check src/onboard.js
          node --check src/rally-control-data.js
      - name: Validate official FIA championship standings
        env:
          WRC_SEASON: "2026"
        run: |
          node scripts/fetch-fia-standings.mjs
          node -e 'const s=require("./public/data/standings.json"); for (const k of ["drivers","coDrivers","manufacturers"]) if (!s.categories[k]?.length) process.exit(1); console.log("Verified FIA standings:", Object.fromEntries(Object.entries(s.categories).map(([k,v])=>[k,v.length])));'
      - name: Validate Moto-DB schedule and normalized snapshots
        env:
          WRC_SEASON: "2026"
        run: node scripts/fetch-moto-db.mjs
      - name: Build site
        run: npm run build
